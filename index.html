<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3ec">
  <meta name="description" content="چیزی تازه در راه است. به‌زودی اینجا می‌بینیمتان.">
  <title>به‌زودی | چیزی تازه در راه است</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f3ec;
      --ink: #173a32;
      --muted: #64736a;
      --accent: #d65b3e;
      --line: rgba(23, 58, 50, .16);
      font-family: "Vazirmatn", Tahoma, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, .92fr);
      direction: rtl;
    }

    .message {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
      padding: clamp(28px, 6vw, 82px);
      overflow: hidden;
      background-image: radial-gradient(rgba(23, 58, 50, .12) .7px, transparent .7px);
      background-size: 15px 15px;
    }

    .topline, .footline {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .identity {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .mark {
      position: relative;
      width: 30px;
      aspect-ratio: 1;
      border: 1px solid var(--ink);
      border-radius: 50%;
    }

    .mark::before, .mark::after {
      position: absolute;
      content: "";
      background: var(--accent);
      border-radius: 50%;
    }

    .mark::before { width: 7px; height: 7px; top: 5px; right: 5px; }
    .mark::after { width: 4px; height: 4px; bottom: 5px; left: 6px; }

    .edition {
      color: var(--muted);
      font-size: 12px;
    }

    .copy {
      position: relative;
      z-index: 1;
      max-width: 620px;
      padding: 64px 0;
      animation: arrive .8s cubic-bezier(.2,.7,.2,1) both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 24px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
    }

    .eyebrow::before {
      width: 28px;
      height: 1px;
      content: "";
      background: currentColor;
    }

    h1 {
      max-width: 590px;
      margin: 0;
      font-size: clamp(44px, 6vw, 82px);
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: 0;
    }

    h1 span { color: var(--accent); }

    .description {
      max-width: 430px;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: clamp(15px, 1.35vw, 18px);
      line-height: 2.1;
    }

    .footline {
      color: var(--muted);
      font-size: 12px;
    }

    .social-note { display: flex; align-items: center; gap: 9px; }
    .social-note::before { width: 7px; height: 7px; content: ""; background: var(--accent); border-radius: 50%; }

    .visual {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      background: #315b50;
      isolation: isolate;
    }

    .visual::before {
      position: absolute;
      z-index: -1;
      inset: 0;
      content: "";
      background: linear-gradient(180deg, rgba(13, 35, 29, .05) 35%, rgba(13, 35, 29, .55) 100%),
        url("https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1500&q=85") center / cover;
      animation: reveal 1.2s ease-out both;
    }

    .visual-caption {
      position: absolute;
      right: clamp(24px, 4vw, 54px);
      bottom: clamp(26px, 4vw, 54px);
      left: clamp(24px, 4vw, 54px);
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      color: #fff;
    }

    .caption-text { margin: 0; font-size: 13px; }

    .caption-index {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
    }

    .caption-index::before { width: 26px; height: 1px; content: ""; background: rgba(255,255,255,.75); }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes reveal {
      from { opacity: .6; transform: scale(1.035); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 760px) {
      .page { grid-template-columns: 1fr; grid-template-rows: minmax(410px, 60vh) minmax(280px, 40vh); }
      .message { min-height: 0; padding: 25px 24px 21px; }
      .copy { padding: 45px 0; }
      h1 { font-size: clamp(42px, 10vw, 65px); }
      .description { margin-top: 14px; font-size: 14px; }
      .visual { min-height: 280px; }
      .visual::before { background-position: center 56%; }
      .footline { font-size: 11px; }
    }

    @media (max-width: 380px) {
      .edition { font-size: 11px; }
      .message { padding-right: 19px; padding-left: 19px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="message" aria-labelledby="page-title">
      <header class="topline">
        <div class="identity"><span class="mark" aria-hidden="true"></span><span>یک شروع تازه</span></div>
        <span class="edition">نسخه‌ی جدید، به‌زودی</span>
      </header>

      <div class="copy">
        <p class="eyebrow">در حال آماده‌سازی</p>
        <h1 id="page-title">چیزی تازه<br>در راه <span>است.</span></h1>
        <p class="description">داریم آخرین جزئیات را آماده می‌کنیم. به‌زودی اینجا می‌بینیمتان.</p>
      </div>

      <footer class="footline">
        <span>با حوصله می‌سازیمش.</span>
        <span class="social-note">به‌زودی همین‌جا</span>
      </footer>
    </section>

    <section class="visual" aria-label="نمایی از موج‌های دریا">
      <div class="visual-caption">
        <p class="caption-text">هر شروعی، جایی از راه می‌رسد.</p>
        <span class="caption-index">۰۰۱</span>
      </div>
    </section>
  </main>
</body>
</html>
